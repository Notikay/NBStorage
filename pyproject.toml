[project]
name = "nbstorage"
version = "0.1.0"
description = "Менеджер паролей"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "dishka>=1.10.1",
    "fastapi>=0.136.3",
    "minio>=7.2.20",
    "orjson>=3.11.9",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.14.1",
    "pydantic[email]>=2.13.4",
    "sqlalchemy>=2.0.50",
    "structlog>=25.5.0",
    "uvicorn>=0.48.0",
]
authors = [
    {name = "Notikay", email = "notikay24@gmail.com"}
]
maintainers = [
    {name = "Notikay", email = "notikay24@gmail.com"}
]
readme = "README.md"
license = {file = "LICENSE"}
keywords = [
    "NBStorage",
    "nb",
    "notibit",
    "storage",
    "manager",
    "password",
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Regular Users",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Windows 10/11",
]

[project.urls]
Homepage = "https://github.com/Notikay/NBStorage"
Documentation = "https://github.com/Notikay/NBStorage/tree/master/docs/"
Repository = "https://github.com/Notikay/NBStorage.git"
"Bug Tracker" = "https://github.com/Notikay/NBStorage/issues"
Changelog = "https://github.com/Notikay/NBStorage/tree/master/CHANGELOG.md"


[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.15",
]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]
all = [
    { include-group = "dev" },
    { include-group = "test" },
]


[tool.ruff]
target-version = "py313"
line-length = 88
required-version = ">=0.15.15"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "ANN",
    "B",
    "C4",
    "SIM",
    "RET",
    "TRY",
    "PTH",
    "TCH",
    "PERF",
    "ARG",
    "DTZ",
    "S",
    "RUF",
    "ARG",
    "DTZ",
    "TCH",
    "ERA",
    "PLC",
    "PLE",
    "PLW",
    "UP",
]
ignore = [
    # self/cls не требуют аннотаций.
    "ANN101",
    "ANN102",

    # Не требует выноса в TYPE_CHECKING.
    "TC001",

    # Допускает схожие русские и английские символы.
    "RUF001",
    "RUF002",
    "RUF003",

    # Не требует выноса в else и допускает длинные сообщения.
    "TRY003",
    "TRY300",

    # Any разрешен.
    "ANN401",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "E402",
    "T201",
]
"tests/*" = [
    "S101",
]

[tool.ruff.format]
docstring-code-format = true


[tool.mypy]
python_version = "3.13"
mypy_path = ["src"]
strict = true
pretty = true
show_error_codes = true
explicit_package_bases = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true


[tool.pytest.ini_options]
pythonpath=["src"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
filterwarnings = [
    "error",
]


[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
