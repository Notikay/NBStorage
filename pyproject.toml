requires-python = ">=3.13"
authors = [
    {name = "Бобошко Антон", email = "anton.bobbis@gmail.com"}
]
maintainers = [
    {name = "Бобошко Антон", email = "anton.bobbis@gmail.com"}
]
description = "Менеджер паролей"
readme = "README.md"
license = {file = "LICENSE"}
keywords = [
    "NBStorage",
    "nb",
    "notibit",
