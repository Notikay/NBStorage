services:
  nbstorage:
    image: nbstorage
    build: .
    container_name: nbstorage

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    networks:
      - backend

    depends_on:
      db:
        condition: service_healthy
      store:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      asset-bootstrap:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

    mem_limit: 2g
    cpus: 2

  db:
    image: postgres:16-alpine
    container_name: postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nbtestpassword
      POSTGRES_DB: postgres-database

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    networks:
      - backend

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres-database"]
      interval: 10s
      timeout: 5s
      retries: 3

  store:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: nbtestpassword

    volumes:
      - minio_data:/var/lib/minio/data

    ports:
      - "9000:9000"
      - "9001:9001"

    networks:
      - backend

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  migrator:
    build: .
    container_name: migrator

    restart: no

    command: alembic upgrade head

    env_file:
      - .env

    networks:
      - backend

    depends_on:
      db:
        condition: service_healthy

  asset-bootstrap:
    build: .
    container_name: asset-bootstrap

    restart: no

    command: python -m infrastructure.bootstrap.assets.minio_loader

    env_file:
      - .env

    networks:
      - backend

    depends_on:
      store:
        condition: service_healthy


networks:
  backend:

volumes:
  postgres_data:
  minio_data:
